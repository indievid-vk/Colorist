<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- App Background Plate -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Outer Wheel Spectrum Dots -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- 12 Petals of Itten Wheel -->
    <circle cx="0" cy="-140" r="22" fill="#E53935" stroke="#ffffff" stroke-width="3" />
    <circle cx="70" cy="-121" r="22" fill="#F4511E" stroke="#ffffff" stroke-width="3" />
    <circle cx="121" cy="-70" r="22" fill="#FB8C00" stroke="#ffffff" stroke-width="3" />
    <circle cx="140" cy="0" r="22" fill="#FDD835" stroke="#ffffff" stroke-width="3" />
    <circle cx="121" cy="70" r="22" fill="#84CC16" stroke="#ffffff" stroke-width="3" />
    <circle cx="70" cy="121" r="22" fill="#10B981" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="140" r="22" fill="#06B6D4" stroke="#ffffff" stroke-width="3" />
    <circle cx="-70" cy="121" r="22" fill="#2563EB" stroke="#ffffff" stroke-width="3" />
    <circle cx="-121" cy="70" r="22" fill="#6366F1" stroke="#ffffff" stroke-width="3" />
    <circle cx="-140" cy="0" r="22" fill="#9333EA" stroke="#ffffff" stroke-width="3" />
    <circle cx="-121" cy="-70" r="22" fill="#DB2777" stroke="#ffffff" stroke-width="3" />
    <circle cx="-70" cy="-121" r="22" fill="#F43F5E" stroke="#ffffff" stroke-width="3" />

    <!-- Connecting Harmony Triangle -->
    <polygon points="0,-140 121,70 -121,70" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="4" stroke-linejoin="round" />
    <polygon points="0,-140 121,70 -121,70" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" />

    <!-- Core Eyedropper / Palette Target Hub -->
    <circle cx="0" cy="0" r="48" fill="#ffffff" filter="url(#glow)" />
    <circle cx="0" cy="0" r="38" fill="#4f46e5" />
    <circle cx="0" cy="0" r="16" fill="#ffffff" />
    
    <!-- Crosshair Guides -->
    <line x1="-28" y1="0" x2="-8" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="8" y1="0" x2="28" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-28" x2="0" y2="-8" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="8" x2="0" y2="28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
